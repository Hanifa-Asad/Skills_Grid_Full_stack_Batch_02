<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
<h2 class="logo">TaskFlow</h2>

<nav class="navlinks">
    <a href="#">Dashboard</a>
    <a href="#">My Tasks</a>
    <a href="#">Profile</a>
</nav>

<button class="profilebtn">HA</button>
    </header>


    <main class="dashboard">
        <section class="welcome">
            <div>
                <h1>My Dashboard</h1>
                <p>Organize your work and stay productive</p>
            </div>

            <button class="addbtn">+NewTask</button>
        </section>

        <section class="stats">
            <article class="statcard">
                <span>Total Tasks</span>
                <h2>8</h2>
                <p>Great Progress</p>
            </article>
        </section>


        <section class="content">
            <div class="tasksection">
                <h2>Todays Tasks</h2>
                <article class="task">
                    <div class="taskinfo">
                        <h3>Complete CSS Project</h3>
                        <p>practice Flexbox Properties</p>
                    </div>
                    <spam class="statusprogress">In Progress</spam>
                </article>
                <article class="task">
                    <div class="taskinfo">
                        <h3>Review HTML</h3>
                        <p>Revise Semantic Elements</p>
                    </div>
                    <span class="statuspending">
                        Pending
                    </span>
                </article>
            </div>
            <aside class="sidecard">
                <h2>Daily Goal</h2>
                <p>Keep Learning Everyday</p>
                <div class="goalbar">
                    <div class="goalprogress"></div>
                </div>
                <strong>70% Completed</strong>
            </aside>
        </section>
    </main>
</body>
</html>
